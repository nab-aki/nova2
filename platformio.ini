; Nova（Freenove 4WD Car Kit for ESP32 FNK0053 ベース）
; ボードは ESP32-WROVER（FNK0053 搭載モジュール）。カメラは当面未使用。
; ライブラリは公式リポジトリ Libraries/ の zip を lib/ に取り込み済み
; https://github.com/Freenove/Freenove_4WD_Car_Kit_for_ESP32
;   PCA9685_v3.0.3 / PCF8574_v0.4.4 / Freenove_VK16K33_Lib_For_ESP32_v1.0.0
;   Freenove_WS2812_Lib_for_ESP32_v2.0.1（Arduino-ESP32 2.x 向けに最小改変。lib/…/NOVA_PATCH.md 参照）
; IR受信：IRremoteESP8266（platformio のライブラリ管理で取得。バージョン固定）。公式の Freenove_IR_Lib は
;   新しい RMT ドライバ用（driver/rmt_rx.h）で Arduino-ESP32 2.0.17 ではビルドできないため（docs/specs/common_ir.md）。
; tools/ 配下は測定用の独立プロジェクトで、本プロジェクトのビルドには含まれない。

[env:fnk0053]
platform = espressif32@7.1.3
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
lib_deps = crankyoldgit/IRremoteESP8266@2.8.6
; IRremoteESP8266 は、既定ではすべてのプロトコルを組み込む。Freenove のリモコンは NEC なので NEC だけにする
; （フラッシュ +約12KB）
build_flags =
  -D_IR_ENABLE_DEFAULT_=false
  -DDECODE_NEC=true
