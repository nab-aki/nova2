; VL53L8CX（ToF センサー）の確認用プロジェクト。l8cx_i2c・l8cx_spi・l5cx_sparkfun はビルドだけ（実機には書き込まない）
; Nova 本体（ルートの platformio.ini・src/）とは独立。ボード・フレームワーク・platform のバージョンは本体に合わせる
;   pio run -d experiments/vl53l8cx_build            … 3つの環境を全部ビルド
;   pio run -d experiments/vl53l8cx_build -e l8cx_i2c … 1つだけ
; ライブラリは .pio/libdeps に取得される（.pio/ は .gitignore 済み）
; l8cx_init_time・l8cx_ranging は実機に書き込む単体試験（スプリント3.6-1）。ライブラリは Nova の lib/ の改変版を使う
;   pio run -d experiments/vl53l8cx_build -e l8cx_ranging -t upload --upload-port COM4

[platformio]
default_envs = l8cx_i2c, l8cx_spi, l5cx_sparkfun, l8cx_init_time, l8cx_ranging

[env]
platform = espressif32@7.1.3
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200

; STM32duino の VL53L8CX：I2C（Wire1）
[env:l8cx_i2c]
lib_deps = https://github.com/stm32duino/VL53L8CX.git#2.1.0
build_src_filter = +<l8cx_i2c/>

; STM32duino の VL53L8CX：SPI
[env:l8cx_spi]
lib_deps = https://github.com/stm32duino/VL53L8CX.git#2.1.0
build_src_filter = +<l8cx_spi/>

; 比較用：SparkFun の VL53L5CX（兄弟機）：I2C（Wire1）
[env:l5cx_sparkfun]
lib_deps = https://github.com/sparkfun/SparkFun_VL53L5CX_Arduino_Library.git#v1.0.3
build_src_filter = +<l5cx_sparkfun/>

; 単体試験：begin()・init() の戻り値と時間、そのあと loop に到達するか（lib/STM32duino_VL53L8CX＝IO_Read に上限を付けた版）
[env:l8cx_init_time]
lib_extra_dirs = ../../lib
lib_deps = STM32duino VL53L8CX
build_src_filter = +<l8cx_init_time/>

; 単体試験：測距の時間・失敗・区画の表（キー g r s）と、首を振りながらの測距（キー n）・切り分け（キー a v h c）。PCA9685 は本体と同じ設定、モーターは触らない
; ToF のモニタリング（スプリント3.6-2）も入っている。Wi-Fi は src/l8cx_ranging/wifi_secrets.h（.gitignore 済み。wifi_secrets.example.h をコピー）がなければ使わない
[env:l8cx_ranging]
lib_extra_dirs = ../../lib
lib_deps =
  STM32duino VL53L8CX
  PCA9685
build_src_filter = +<l8cx_ranging/>
