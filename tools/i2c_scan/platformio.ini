; Freenove 4WD Car Kit for ESP32（FNK0053）
; I2C スキャン・ツール：共有バス（Wire、GPIO13/14、100kHz）に何が見えるかを調べる
; ジャイロ（LSM6DSV16X）の WHO_AM_I も読む。モーター・首は動かさない（PCA9685 へは何も書かない）
; 本体（ルートの platformio.ini）とは独立。ボードとプラットフォームは本体に合わせる

[env:fnk0053]
platform = espressif32@7.1.3
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
