; Freenove 4WD Car Kit for ESP32（FNK0053）
; M2案（首に目＝LEDマトリクスと超音波を搭載）の測定ツール
; 水平角度の探索・首の安定時間・測距のばらつき・停止距離を測る
; ライブラリは公式リポジトリ（Libraries/PCA9685_v3.0.3.zip）から lib/ に取り込み済み
; https://github.com/Freenove/Freenove_4WD_Car_Kit_for_ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
