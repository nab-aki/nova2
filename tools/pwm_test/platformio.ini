; Freenove 4WD Car Kit for ESP32（FNK0053）
; モーター最低PWM・首サーボ角度・超音波・ライントラッキング・電池電圧の測定ツール
; ライブラリは公式リポジトリ（Libraries/PCA9685_v3.0.3.zip, Libraries/PCF8574_v0.4.4.zip）
; から lib/ に取り込み済み
; https://github.com/Freenove/Freenove_4WD_Car_Kit_for_ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
